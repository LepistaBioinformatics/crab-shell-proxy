# Bundled fallback hermes-agent profile for crab-shell-proxy.
#
# The proxy patches model.{default,provider,base_url} into this file at first
# provision (from the agent's `model:` block in config.yaml) and injects the API
# server settings + the provider key as container env — so nothing secret lives
# here. Operators can ship a richer per-agent template under
# <dataRoot>/templates/<agent>/config.yaml to override this fallback.
model:
  default: ""
  provider: ""
toolsets:
  - hermes-cli
agent:
  max_turns: 90
memory:
  memory_enabled: false
