# crab-shell-proxy configuration.
#
# Machine-specific fields (hostDataRoot, network) are normally supplied via env
# (CRAB_HOST_DATA_ROOT, CRAB_NETWORK) from docker-compose so this file stays
# portable — see the compose service definition. The values below are sane
# fallbacks for a local `docker compose up` from the project root.

listen: ":8080"

# Absolute HOST path of the data root. This is the bind-mount SOURCE handed to
# the Docker daemon for spawned picoclaw containers, so it must be a path the
# daemon sees (host path), NOT a path inside this proxy. The tenant tree lives
# under <root>/tenants/… and agent templates under <root>/templates/…. Override
# with CRAB_HOST_DATA_ROOT (compose sets it to <project>/data).
hostDataRoot: "/data"

# Where that same directory is mounted INSIDE this proxy (for reading history
# and seeding per-user config). Override with CRAB_CONTAINER_DATA_ROOT.
containerDataRoot: "/data"

# Docker network spawned containers join. The compose file pins this network's
# real name to "zombie_net" (network `name:`), so it is stable regardless of the
# compose project name. Override with CRAB_NETWORK.
network: "zombie_net"

picoclawImage: "docker.io/sipeed/picoclaw:latest"
picoclawPort: 18790

# Spawned picoclaw containers run as this non-root uid:gid (NOT root). The proxy
# relocates the container HOME to picoclawHome, mounts the per-user data dir at
# <picoclawHome>/.picoclaw, aligns the config workspace path, and chowns the
# per-user dir to this uid so the non-root process can write it. Set
# picoclawUser to "" to run as root instead. Override via CRAB_PICOCLAW_USER /
# CRAB_PICOCLAW_HOME.
picoclawUser: "1000:1000"
picoclawHome: "/data"

# Kept comfortably under mycelium's [api] gatewayTimeout (60s) so a cold start
# never races the gateway's own 504.
startupDeadline: 35s

# How long the harness may stay SILENT before the turn is declared dead. NOT a
# cap on how long a turn may take -- a long tool-using turn narrates constantly,
# so it resets this on every frame and can run for as long as the HTTP layer's
# own bound allows (sse.go's turnTimeout, 10m).
#
# This was `turnTimeout` and it capped TOTAL duration, which cut long turns
# mid-work: picoclaw kept going and persisted the answer, so the chat froze and
# the reply only appeared on the next reload. Load now rejects the old key.
turnIdleTimeout: 600s
containerPrefix: "crabshell"

# Shared secret authenticating the mycelium subscriptionAccount.created webhook
# at POST /v1/accounts. Sourced from the environment so it never lives in this
# file; register the same value with mycelium's webhook (Authorization: Bearer).
webhookSecret: { env: "CRAB_WEBHOOK_SECRET" }

# Signs the bearer token a spawned picoclaw container presents to the proxy's own
# MCP endpoint (POST /v1/mcp) to reach its knowledge-graph memory. The token
# carries the workspace scope plus an HMAC over it, so the proxy stores nothing and
# rotating this value revokes every issued token at once.
#
# Unlike webhookSecret, LEAVING THIS UNSET IS SUPPORTED: the memory graph is simply
# disabled — /v1/mcp is not registered and no MCP block is written into any
# workspace's config.json — and everything else behaves as before. That is
# deliberate: a deployment that forgot the secret must get no memory rather than an
# unauthenticated endpoint reachable by every container on the network.
mcpTokenSecret: { env: "CRAB_MCP_TOKEN_SECRET" }

# Authorizes GET /v1/instances — the workspace inventory a telemetry watcher reads
# to attribute a container to its tenant/subscription/user. Nothing else accepts it.
#
# It is deliberately NOT an agent token. The mycelium profile header is decoded and
# never verified, so an agent's token is what stops a caller on the container network
# from asserting any account it likes — it gates chatting AS ANY MEMBER. A monitoring
# component must not be able to send a message as someone.
#
# Same rule as mcpTokenSecret: UNSET IS SUPPORTED and means the route is not
# registered at all — absent, not 401. This endpoint discloses the deployment's whole
# tenant/subscription/user topology, so a forgotten secret must yield no endpoint.
telemetryToken: { env: "CRAB_TELEMETRY_TOKEN" }

# The origin a SPAWNED CONTAINER uses to reach this proxy; it becomes the `url` of
# the MCP server injected into each workspace. The proxy cannot infer the name it
# answers to on the container network, so it is configured here. Override with
# CRAB_MCP_BASE_URL. Default: http://crab-shell-proxy:8080 (the compose service
# name, which is how containers on zombie_net reach it).
mcpBaseURL: "http://crab-shell-proxy:8080"

agents:
  alpha:
    serviceName: "alpha" # matches x-mycelium-service-name mycelium injects
    token: { env: "MYC_PICOCLAW_ALPHA_TOKEN" }
    template: "alpha" # <containerDataRoot>/templates/alpha/{config.json,.security.yml}
    # data now lives under <containerDataRoot>/tenants/<t>/subscriptions/<s>/agents/alpha/users/<u>
    # "continuous" keeps the container running: picoclaw holds each direct session
    # in an in-memory store (SQLite :memory:) and does NOT reload it on restart —
    # so a scale-to-zero stop would reset the conversation and overwrite its
    # transcript on the next turn. Staying up preserves history during use.
    # (idleTimeout is ignored in continuous mode; kept for a quick switch back.)
    mode: "continuous" # or "scale-to-zero"
    idleTimeout: 15m
    # Pin the picoclaw provider/model and take the API key from the environment.
    # The proxy enables the pico channel, sets provider/model, and writes the key
    # (read from apiKeyEnv) into each user's .security.yml at provisioning time,
    # so the key lives only in the env — never in this file or a template.
    # `name` must match a picoclaw model_list model_name (e.g. deepseek-chat,
    # openrouter-auto, gpt-5.4, glm-4.7...). Each agent has its OWN apiKeyEnv, so
    # instances use independent keys (and may use different providers/models).
    model:
      provider: "deepseek"
      name: "deepseek-chat"
      apiKeyEnv: "PICOCLAW_ALPHA_API_KEY"

  # TESTE LOCAL — o segundo harness. Entrada NOVA, nao um flip do alpha (D-5):
  # trocar o harness do unico agente em producao seria cutover, nao coexistencia.
  # Mesmo provider/modelo do alpha, para isolar o harness como variavel.
  gamma:
    serviceName: "gamma"
    harness: "ganglion"
    token: { env: "MYC_GANGLION_TOKEN" }
    template: "alpha"
    # scale-to-zero, que e o ponto do ganglion. O picoclaw fica continuous por
    # causa das tarefas agendadas (timers em memoria); este agente nao as
    # oferece -- /v1/cron/* responde 501 nomeando o modo.
    mode: "scale-to-zero"
    # 120s, nao os 15m do picoclaw. Aqueles existem porque o cold start dele era
    # caro; o do ganglion foi medido em 0,2s. Dois minutos e curto o bastante
    # para o scale-to-zero valer e longo o bastante para nao recriar container
    # entre duas mensagens da mesma conversa.
    idleTimeout: 15s
    model:
      provider: "deepseek"
      name: "deepseek-chat"
      apiKeyEnv: "GANGLION_API_KEY"
      # Obrigatorio para o ganglion: nao existe registry de provider->endpoint,
      # e um baseUrl vazio falha como 404 do provedor, nao como erro de config.
      baseUrl: "https://api.deepseek.com/v1"

  beta:
    serviceName: "beta"
    token: { env: "MYC_PICOCLAW_BETA_TOKEN" }
    template: "beta"
    mode: "continuous" # keep alive so picoclaw's in-memory session isn't reset (see alpha)
    idleTimeout: 15m
    model:
      provider: "deepseek"
      name: "deepseek-chat"
      apiKeyEnv: "PICOCLAW_BETA_API_KEY"
